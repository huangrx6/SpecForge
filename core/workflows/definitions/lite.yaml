id: lite
name: 轻量变更流程 (Lite)
description: 适用于一目了然的小修小补。跳过深度的技术设计(Design)和规格门禁(Spec Review)，直达任务和代码层。
use_for:
  - 小型文案或 UI 调整
  - 简单的静态页面添加
  - 无架构风险的边缘功能
not_for:
  - 影响面不确定的变更（用 feature 或 standard）
  - 涉及数据库、权限、外部集成的改动（用 standard）
  - 需要用户取舍的产品决策（用 feature + brainstorm）
vs:
  feature: lite 范围清楚且无设计风险；feature 有影响面不确定或需要设计评审
  standard: lite 跳过 spec review；standard 需要完整规格和双门禁
stages:
  - 00-intake
  - 01-spec
  - 03-implementation
  - 04-code-review
  - 05-verification
  - 06-close
required_gates:
  code_review: true
  verification: true
  wiki_sync: true
