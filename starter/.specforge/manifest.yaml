specforge:
  version: 0.2.0
  profile: standard
  entry: .specforge/AGENTS.md

workflow:
  default: standard
  available:
    - lite
    - feature
    - standard
    - bugfix
    - refactor
    - discovery

paths:
  attention: .specforge/attention.md
  knowledge: .specforge/workspace/knowledge
  registry: .specforge/registry.yaml
  changes: .specforge/workspace/changes
  active_changes: .specforge/workspace/changes/active
  archived_changes: .specforge/workspace/changes/archive
  rules: .specforge/policy/rules
  tech_profiles: .specforge/policy/tech-profiles
  tools: .specforge/execution/tools
  stages: .specforge/execution/stages
  hooks: .specforge/execution/hooks

gates:
  spec_review: required
  code_review: required
  verification: required
  ssot_sync: required
