id: feature
name: 新功能研发流程 (Feature)
description: 专为新增产品级功能设计。intake 阶段先判断是否需要 graph 外 brainstorm / PRD；用户取舍和 PRD 完成或明确跳过后，再进入 requirements，并按影响面拆分体验设计与技术架构设计。
use_for:
  - 全新的产品页面或能力
  - 核心业务流扩展
  - 涉及交互界面大改
not_for:
  - 已确认的 bug（用 bugfix）
  - 行为不变的代码重构（用 refactor）
  - 一目了然的小修小补（用 lite）
vs:
  standard: feature 明确是产品功能；standard 用于无法归类但风险高的通用变更
  lite: feature 有设计风险或影响面不确定；lite 范围清楚且无设计风险
stages:
  - 00-intake
  - 00-intake (Brainstorm, if decisions need user tradeoff)
  - 00-intake (PRD, if brief requires)
  - 01-spec (Research, if needs_research)
  - 01-spec (Requirements)
  - 01-spec (UI Design, if applicable)
  - 01-spec (Technical Design, if applicable)
  - 02-spec-review
  - 03-implementation
  - 04-code-review
  - 05-verification
  - 06-close
required_gates:
  spec_review: true
  code_review: true
  verification: true
  wiki_sync: true
