id: standard
name: 标准变更流程 (Standard)
description: 通用标准流程，用于无法归入 feature / bugfix / issue / refactor / discovery 但仍需要完整需求、影响面设计、任务和双门禁的变更；intake 可按需触发 graph 外 brainstorm / PRD。
use_for:
  - 通用复杂变更
  - 跨模块的大型联动
  - 涉及安全、金钱、敏感数据流的改动
not_for:
  - 明确是产品新功能（用 feature）
  - 明确是 bug 修复（用 bugfix）
  - 明确是重构（用 refactor）
vs:
  feature: standard 是兜底选项，不确定归类时用；feature 明确是产品功能
  refactor: standard 可能有用户可见行为变化；refactor 用户行为严格不变
stages:
  - 00-intake
  - 00-intake (Brainstorm, if decisions need user tradeoff)
  - 00-intake (PRD, if brief requires)
  - 01-spec (Research, if needs_research)
  - 01-spec (Requirements)
  - 01-spec (UI Design, if applicable)
  - 01-spec (Technical Design, if applicable)
  - 02-spec-review
  - 03-implementation
  - 04-code-review
  - 05-verification
  - 06-close
required_gates:
  spec_review: true
  code_review: true
  verification: true
  wiki_sync: true
