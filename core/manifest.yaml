specforge:
  version: 0.3.0
  profile: standard
  entry: .specforge/AGENTS.md

workflow:
  default: standard
  available:
    - lite
    - feature
    - standard
    - bugfix
    - issue
    - refactor
    - discovery

paths:
  wiki: .specforge/wiki
  registry: .specforge/registry.yaml
  work_items: .specforge/work
  active_work_items: .specforge/work/active
  archived_work_items: .specforge/work/archive
  standards: .specforge/core/standards
  tech_profiles: .specforge/core/profiles
  tools: .specforge/core/scripts
  stages: .specforge/core/workflows/stages
  hooks: .specforge/core/hooks/events
  project_hooks: .specforge/hooks/local

gates:
  spec_review: required
  code_review: required
  verification: required
  wiki_sync: required
