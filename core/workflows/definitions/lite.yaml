id: lite
name: 轻量变更流程 (Lite)
description: 适用于一目了然的小修小补。跳过深度的技术设计(Design)和规格门禁(Spec Review)，直达任务和代码层。
use_for:
  - 小型文案或 UI 调整
  - 简单的静态页面添加
  - 无架构风险的边缘功能
stages:
  - 00-intake
  - 01-spec
  - 03-implementation
  - 04-code-review
  - 05-verification
  - 06-close
required_gates:
  code_review: true
  verification: true
  wiki_sync: true
